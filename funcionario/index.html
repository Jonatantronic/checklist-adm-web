<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checklist de Turno</title><body><p id="s">Carregando Checklist de Turno\u2026</p><script>(async()=>{try{const f=["part-000.txt","part-001.txt","part-002.txt","part-003.txt","part-004.txt","part-005.txt","part-006.txt"];const e=(await Promise.all(f.map(x=>fetch(x,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(x);return r.text()})))).join('');const b=Uint8Array.from(atob(e),x=>x.charCodeAt(0));const t=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close()}catch(e){console.error(e);document.getElementById('s').textContent='N\u00e3o foi poss\u00edvel carregar o Checklist. Atualize a p\u00e1gina.'}})();</script>
