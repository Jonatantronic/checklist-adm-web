<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checklist ADM</title><body><p>Carregando Checklist ADM…</p><script>(async()=>{try{const chunks=await Promise.all(Array.from({length:34},(_,i)=>fetch('web/part-'+String(i).padStart(2,'0')+'.txt').then(r=>{if(!r.ok)throw Error('Falha');return r.text()})));const data=Uint8Array.from(atob(chunks.join('')),c=>c.charCodeAt(0));const html=await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.body.textContent='Não foi possível carregar. Atualize a página com internet.'}})();</script></body></html>
